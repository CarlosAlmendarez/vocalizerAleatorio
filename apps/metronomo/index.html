<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrónomo - MusicTools</title>
    <link rel="stylesheet" href="../../shared/design.css">
    <script src="../../shared/boot.js"></script>
    <script src="../../shared/transport.js"></script>
    <script src="../../shared/settings.js"></script>
    <style>
        /* BPM display */
        .bpm-display { text-align:center; margin:6px 0 4px; }
        .bpm-number { font-family:var(--font-head); font-size:88px; font-weight:900; line-height:1; letter-spacing:-4px; color:var(--ink); transition:color 0.15s, text-shadow 0.15s; }
        .bpm-number.flash { color:var(--accent); text-shadow:var(--accent-glow); }
        .bpm-label { font-size:13px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin-top:2px; }
        .tempo-name { font-size:16px; font-weight:600; color:var(--ink-dim); margin-top:4px; min-height:22px; transition:opacity 0.2s; }

        /* Beat dots */
        .pendulum-wrap { display:flex; justify-content:center; margin:14px 0 6px; height:44px; align-items:center; }
        .beat-dots { display:flex; gap:10px; }
        .beat-dot { width:14px; height:14px; border-radius:50%; background:rgba(255,255,255,0.14); border:1px solid var(--border); transition:background 0.05s, transform 0.05s, box-shadow 0.05s; }
        .beat-dot.accent { background:rgba(var(--accent-rgb),0.25); border-color:rgba(var(--accent-rgb),0.4); width:18px; height:18px; }
        .beat-dot.active { background:var(--ink); transform:scale(1.3); box-shadow:0 0 14px rgba(238,240,255,0.7); }
        .beat-dot.accent.active { background:var(--accent); border-color:var(--accent); box-shadow:0 0 18px rgba(var(--accent-rgb),0.9); }

        /* BPM controls */
        .bpm-control-row { display:flex; align-items:center; gap:10px; }
        .bpm-btn { width:44px; height:44px; border-radius:50%; border:1px solid var(--border); background:var(--surface-s); font-size:22px; font-weight:700; cursor:pointer; font-family:var(--font-sans); display:flex; align-items:center; justify-content:center; transition:all 0.12s; flex-shrink:0; color:var(--ink-dim); line-height:1; }
        .bpm-btn:hover { border-color:rgba(var(--accent-rgb),0.4); color:var(--accent); background:rgba(var(--accent-rgb),0.1); }
        .bpm-btn:active { transform:scale(0.92); }
        .bpm-btn.large { width:52px; height:52px; font-size:26px; }

        .bpm-slider-wrap { flex:1; }
        input[type=range].bpm-slider { width:100%; height:6px; -webkit-appearance:none; appearance:none; background:linear-gradient(to right, var(--accent) var(--pct), var(--surface-ss) var(--pct)); border-radius:6px; outline:none; cursor:pointer; }
        input[type=range].bpm-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); box-shadow:0 2px 6px rgba(var(--accent-rgb),0.5); cursor:pointer; }
        input[type=range].bpm-slider::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--accent); border:none; cursor:pointer; }

        /* Time signature */
        .time-sig-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
        .sig-btn { padding:10px 4px; border-radius:10px; border:1px solid var(--border); background:var(--surface-s); color:var(--ink-dim); font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-sans); text-align:center; transition:all 0.15s; }
        .sig-btn:hover  { border-color:rgba(var(--accent-rgb),0.4); color:var(--ink); }
        .sig-btn.active { background:rgba(var(--accent-rgb),0.22); border-color:var(--accent); color:var(--accent); }

        /* Tap tempo */
        .tap-btn {
            width:100%; padding:14px 16px;
            border-radius:14px; border:2px dashed rgba(var(--accent-rgb),0.35);
            background:rgba(var(--accent-rgb),0.06); color:var(--accent);
            cursor:pointer; font-family:var(--font-sans);
            transition:background 0.08s, transform 0.08s, box-shadow 0.15s;
            touch-action:manipulation; user-select:none; -webkit-user-select:none;
            display:flex; flex-direction:column; align-items:center; gap:4px;
        }
        .tap-btn:active { background:rgba(var(--accent-rgb),0.14); transform:scale(0.97); border-style:solid; }
        .tap-btn.tapping {
            background:rgba(var(--accent-rgb),0.2);
            box-shadow:0 0 20px rgba(var(--accent-rgb),0.3);
            border-style:solid;
        }
        .tap-text { font-size:16px; font-weight:700; letter-spacing:0.5px; line-height:1; }
        .tap-hint { font-size:11px; font-weight:600; letter-spacing:0.06em; color:rgba(var(--accent-rgb),0.65); min-height:15px; line-height:1; }

        /* Preset grid */
        .preset-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
        .preset-btn { padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--surface-s); color:var(--ink-dim); cursor:pointer; font-family:var(--font-sans); text-align:left; transition:all 0.12s; display:flex; justify-content:space-between; align-items:center; }
        .preset-btn:hover  { border-color:rgba(var(--accent-rgb),0.4); background:var(--surface-ss); color:var(--ink); }
        .preset-btn.active { background:rgba(var(--accent-rgb),0.14); border-color:var(--accent); }
        .preset-name { font-size:13px; font-weight:700; color:var(--ink); }
        .preset-range { font-size:11px; color:var(--muted); }
            /* Subdivisión, volumen, contador y entrenador de tempo */
        .bar-counter { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-align: center; }
        .opt-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: var(--ink-dim); }
        .opt-row label { flex: 1; }
        .opt-row input[type=range] { flex: 1.4; accent-color: var(--accent); }
        .sub-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .trainer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
        .trainer-grid label { display: block; font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
        .trainer-grid input {
            width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface-s); color: var(--ink); font: 700 15px var(--font-head); text-align: center;
        }
        .trainer-status { margin-top: 10px; font-size: 12px; color: var(--accent); font-weight: 600; min-height: 16px; }
        .switch-btn {
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--surface-s); color: var(--muted); font: 700 12px var(--font-sans); cursor: pointer;
        }
        .switch-btn.on { color: var(--accent); border-color: var(--accent); background: rgba(var(--accent-rgb), .14); }
</style>
</head>
<body data-tool-name="Metrónomo" data-page-id="metronomo">
<div class="app-card">

    <!-- ── Display ── -->
    <div class="display-section">
        <div class="bpm-display">
            <div class="bpm-number" id="bpmNumber">120</div>
            <div class="bpm-label">BPM</div>
            <div class="tempo-name" id="tempoName">Allegro</div>
        </div>

        <div class="pendulum-wrap">
            <div class="beat-dots" id="beatDots"></div>
        </div>
        <div class="bar-counter" id="barCounter">Compás —</div>
    </div>

    <!-- ── Controles ── -->
    <div class="config-body">

        <!-- BPM slider -->
        <div class="section-card">
            <div class="section-title">Tempo</div>
            <div class="bpm-control-row" style="margin-bottom:14px;">
                <button class="bpm-btn large" onclick="changeBpm(-10)" title="-10">−−</button>
                <button class="bpm-btn" onclick="changeBpm(-1)" title="-1">−</button>
                <div class="bpm-slider-wrap">
                    <input type="range" class="bpm-slider" id="bpmSlider"
                           min="20" max="300" value="120"
                           oninput="setBpm(parseInt(this.value))">
                </div>
                <button class="bpm-btn" onclick="changeBpm(+1)" title="+1">+</button>
                <button class="bpm-btn large" onclick="changeBpm(+10)" title="+10">++</button>
            </div>

            <!-- Tap tempo -->
            <button class="tap-btn" id="tapBtn" onclick="tapTempo()">
                <span class="tap-text">Tap Tempo</span>
                <span class="tap-hint" id="tapHint"></span>
            </button>
        </div>

        <!-- Compás -->
        <div class="section-card">
            <div class="section-title">Compás</div>
            <div class="time-sig-grid" id="timeSigGrid">
                <button class="sig-btn" onclick="setTimeSig(2,4,this)">2/4</button>
                <button class="sig-btn active" onclick="setTimeSig(4,4,this)">4/4</button>
                <button class="sig-btn" onclick="setTimeSig(3,4,this)">3/4</button>
                <button class="sig-btn" onclick="setTimeSig(6,8,this)">6/8</button>
                <button class="sig-btn" onclick="setTimeSig(5,4,this)">5/4</button>
                <button class="sig-btn" onclick="setTimeSig(7,8,this)">7/8</button>
                <button class="sig-btn" onclick="setTimeSig(12,8,this)">12/8</button>
                <button class="sig-btn" onclick="setTimeSig(1,4,this)">1/4</button>
            </div>
        </div>

        <!-- Subdivisión y volumen -->
        <div class="section-card">
            <div class="section-title">Subdivisión</div>
            <div class="sub-grid" id="subGrid">
                <button class="sig-btn active" onclick="setSubdiv(1,this)" title="Un clic por pulso">♩</button>
                <button class="sig-btn" onclick="setSubdiv(2,this)" title="Corcheas">♫</button>
                <button class="sig-btn" onclick="setSubdiv(3,this)" title="Tresillos">3</button>
                <button class="sig-btn" onclick="setSubdiv(4,this)" title="Semicorcheas">4</button>
            </div>
            <div class="opt-row">
                <label for="volSlider">Volumen</label>
                <input type="range" id="volSlider" min="0" max="100" value="80" oninput="setVolume(+this.value)">
            </div>
        </div>

        <!-- Entrenador de tempo -->
        <div class="section-card" id="trainerCard">
            <div class="opt-row" style="margin-top:0">
                <div class="section-title" style="margin:0;flex:1">Entrenador de tempo</div>
                <button class="switch-btn" id="trainerBtn" onclick="toggleTrainer()">Apagado</button>
            </div>
            <div class="trainer-grid">
                <div><label for="trInc">Subir BPM</label><input type="number" id="trInc" min="1" max="20" value="5"></div>
                <div><label for="trBars">Cada (compases)</label><input type="number" id="trBars" min="1" max="32" value="4"></div>
                <div><label for="trMax">Hasta BPM</label><input type="number" id="trMax" min="30" max="300" value="160"></div>
            </div>
            <div class="trainer-status" id="trainerStatus"></div>
        </div>

        <!-- Presets de tempo -->
        <div class="section-card">
            <div class="section-title">Indicaciones de tempo</div>
            <div class="preset-grid" id="presetGrid"></div>
        </div>

    </div>

    <div class="action-bar">
        <button class="btn btn-primary" id="mainBtn" onclick="toggleMetronome()" style="font-size:18px;font-weight:800;letter-spacing:0.5px;">
            ▶ Iniciar
        </button>
    </div>
</div>

<script>
// ══════════════════════════════════════════════
//  PRESETS DE TEMPO
// ══════════════════════════════════════════════
const TEMPO_PRESETS = [
    { name: 'Largo',       min: 20,  max: 52,  bpm: 40  },
    { name: 'Larghetto',   min: 52,  max: 63,  bpm: 58  },
    { name: 'Adagio',      min: 63,  max: 76,  bpm: 70  },
    { name: 'Andante',     min: 76,  max: 100, bpm: 88  },
    { name: 'Moderato',    min: 100, max: 116, bpm: 108 },
    { name: 'Allegretto',  min: 116, max: 126, bpm: 120 },
    { name: 'Allegro',     min: 126, max: 160, bpm: 140 },
    { name: 'Vivace',      min: 160, max: 176, bpm: 168 },
    { name: 'Presto',      min: 176, max: 210, bpm: 192 },
    { name: 'Prestissimo', min: 210, max: 300, bpm: 240 },
];

// ══════════════════════════════════════════════
//  ESTADO
// ══════════════════════════════════════════════
const store       = createStore('metronomo');
let bpm           = 120;
let subdiv        = 1;      // clics por pulso: 1 negras, 2 corcheas, 3 tresillos, 4 semicorcheas
let volume        = 0.8;
let barCount      = 0;
let trainer       = { on: false, startBpm: 0, bars: 0 };
let beatsPerBar   = 4;
let beatUnit      = 4;
let currentBeat   = 0;
let isPlaying     = false;

// Web Audio — el timing lo lleva el Transport compartido (shared/transport.js).
// Todo lo que suena se agenda con el reloj de AudioContext, así que el
// tempo real coincide siempre con el BPM configurado, sin deriva.
let transport   = null;
let _master     = null;

function tctx() { return transport ? transport.ctx : null; }

// GainNode maestro, creado sobre el contexto que use el Transport.
function master() {
    const c = tctx();
    if (!c) return null;
    if (!_master || _master.context !== c) {
        _master = c.createGain();
        _master.gain.value = volume;
        _master.connect(c.destination);
    }
    return _master;
}

// Tap tempo — interval-buffer algorithm
let tapIntervals   = [];   // stores last 4 intervals in ms
let lastTapTime    = 0;    // absolute timestamp of previous tap
const TAP_RESET_MS = 2500; // inactivity auto-reset timer

// ══════════════════════════════════════════════
//  SÍNTESIS DE SONIDO CLÁSICO DE METRÓNOMO
//  (clic de madera con ataque nítido y decay corto)
// ══════════════════════════════════════════════
// Pulsos dentro del compás (acento secundario). En compases compuestos e
// irregulares el oído agrupa las corcheas: 6/8 = 3+3, 12/8 = 3+3+3+3,
// 7/8 = 2+2+3, 5/4 = 3+2. Antes solo sonaba acentuado el tiempo 1.
function beatGroupStarts() {
    const key = beatsPerBar + '/' + beatUnit;
    return { '6/8':[0,3], '12/8':[0,3,6,9], '7/8':[0,2,4], '5/4':[0,3] }[key] || [0];
}

function scheduleClick(time, isAccent, isSecondary = false) {
    const audioCtx = tctx();
    if (!audioCtx) return;
    const out = master();

    // ── Componente 1: Cuerpo resonante (sinusoide con barrido de frecuencia)
    //    Simula la resonancia de la caja de madera del metrónomo
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();

    osc.type = 'sine';
    // El tono baja rápidamente: da el carácter "tok" vs un tono puro
    osc.frequency.setValueAtTime(isAccent ? 1850 : isSecondary ? 1500 : 1200, time);
    osc.frequency.exponentialRampToValueAtTime(isAccent ? 620 : isSecondary ? 520 : 420, time + 0.045);

    oscGain.gain.setValueAtTime(0, time);
    oscGain.gain.linearRampToValueAtTime(isAccent ? 0.85 : isSecondary ? 0.7 : 0.55, time + 0.001);
    oscGain.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);

    osc.connect(oscGain);
    oscGain.connect(out);
    osc.start(time);
    osc.stop(time + 0.08);

    // ── Componente 2: Transiente de ataque (ruido filtrado ~5 ms)
    //    Da el "click" inicial nítido, como el golpe físico de la paleta
    const clickDur  = 0.005;
    const bufSize   = Math.ceil(audioCtx.sampleRate * clickDur);
    const noiseBuf  = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data      = noiseBuf.getChannelData(0);

    for (let i = 0; i < bufSize; i++) {
        // Ruido con envolvente de caída lineal (más nítido al inicio)
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
    }

    const noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuf;

    // Filtro pasa-banda para dar el timbre de madera
    const bpFilter = audioCtx.createBiquadFilter();
    bpFilter.type      = 'bandpass';
    bpFilter.frequency.value = isAccent ? 3200 : 2200;
    bpFilter.Q.value   = 1.8;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(isAccent ? 0.55 : 0.38, time);

    noiseNode.connect(bpFilter);
    bpFilter.connect(noiseGain);
    noiseGain.connect(out);

    noiseNode.start(time);
    noiseNode.stop(time + clickDur + 0.002);
}

// ══════════════════════════════════════════════
//  CONTROL DE REPRODUCCIÓN
// ══════════════════════════════════════════════
// Barra espaciadora (shell.js)
function mtPlayToggle() { toggleMetronome(); }

async function toggleMetronome() {
    if (isPlaying) {
        stopMetronome();
    } else {
        await startMetronome();
    }
}

async function startMetronome() {
    if (!transport) {
        transport = createTransport({
            getBpm: () => bpm,
            subdiv: subdiv,   // el BPM es la velocidad del pulso; la subdivisión añade clics suaves
            onStep: (step, time) => {
                // Acento en el primer tiempo del compás (independiente del
                // denominador: 6/8 a 120 BPM = 120 clics/min, como 4/4).
                if (step % subdiv !== 0) { scheduleSubClick(time); return; }
                const beat = (step / subdiv) % beatsPerBar;
                if (beat === 0 && step > 0) onNewBar();
                scheduleClick(time, beat === 0, beatGroupStarts().includes(beat));
            },
            onDraw: (step) => {
                if (step % subdiv !== 0) return;
                const beat = (step / subdiv) % beatsPerBar;
                flashBeat(beat);
                if (beat === 0) document.getElementById('barCounter').textContent = 'Compás ' + (barCount + 1);
            },
        });
    }

    isPlaying = true;
    MT.keepAwake(true);   // pantalla encendida mientras suena
    barCount = 0;
    transport.subdiv = subdiv;
    if (trainer.on) { trainer.startBpm = bpm; trainer.bars = 0; updateTrainerStatus(); }
    await transport.start();

    document.getElementById('mainBtn').innerHTML =
        '■ Detener';
    document.getElementById('mainBtn').className = 'btn btn-primary'; document.getElementById('mainBtn').style.background='linear-gradient(135deg, var(--danger), rgba(var(--danger-rgb), 0.75))';
}

function stopMetronome() {
    isPlaying = false;
    MT.keepAwake(false);
    document.getElementById('barCounter').textContent = 'Compás —';
    // El entrenador deja el tempo donde empezó, para repetir el ejercicio
    if (trainer.on && trainer.startBpm) { setBpm(trainer.startBpm); renderPresets(); updateTrainerStatus(); }
    if (transport) transport.stop();

    // Apagar todos los beat dots
    document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));

    document.getElementById('mainBtn').innerHTML =
        '▶ Iniciar';
    document.getElementById('mainBtn').className = 'btn btn-primary'; document.getElementById('mainBtn').style.background='';
}

// ══════════════════════════════════════════════
//  CONTROLES DE BPM
// ══════════════════════════════════════════════
function setBpm(val) {
    bpm = Math.max(20, Math.min(300, val));
    store.set('bpm', bpm);

    document.getElementById('bpmNumber').textContent = bpm;
    document.getElementById('bpmSlider').value       = bpm;

    // Actualizar fondo del slider
    const pct = ((bpm - 20) / (300 - 20)) * 100;
    document.getElementById('bpmSlider').style.setProperty('--pct', pct + '%');

    // Nombre del tempo
    const preset = TEMPO_PRESETS.find(p => bpm >= p.min && bpm < p.max)
                || TEMPO_PRESETS[TEMPO_PRESETS.length - 1];
    document.getElementById('tempoName').textContent = preset.name;

    // Flash del número
    const el = document.getElementById('bpmNumber');
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 120);

    // Actualizar preset activo
    document.querySelectorAll('.preset-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.name === preset.name);
    });
}

function changeBpm(delta) {
    setBpm(bpm + delta);
}

// ══════════════════════════════════════════════
//  TAP TEMPO
// ══════════════════════════════════════════════
function tapTempo() {
    const now  = Date.now();
    const hint = document.getElementById('tapHint');
    const btn  = document.getElementById('tapBtn');

    // Reset buffer if gap > 2 s (< 30 BPM = new session)
    if (lastTapTime > 0 && now - lastTapTime > 2000) {
        tapIntervals = [];
    }

    // Store interval from previous tap (skip on first tap)
    if (lastTapTime > 0) {
        tapIntervals.push(now - lastTapTime);
        if (tapIntervals.length > 4) tapIntervals.shift(); // keep last 4
    }

    lastTapTime = now;

    // Calculate BPM from average of stored intervals
    if (tapIntervals.length > 0) {
        const avg = tapIntervals.reduce((a, b) => a + b, 0) / tapIntervals.length;
        setBpm(Math.round(60000 / avg));
    }

    // Progress feedback
    const n = tapIntervals.length;
    if (n === 0) {
        hint.textContent = 'Sigue presionando...';
    } else if (n < 4) {
        hint.textContent = `${n + 1} / 4 taps`;
    } else {
        hint.textContent = `✓ ${bpm} BPM calibrado`;
    }

    // Flash
    btn.classList.add('tapping');
    setTimeout(() => btn.classList.remove('tapping'), 130);

    // Auto-reset after 2.5 s of inactivity
    clearTimeout(tapTempo._reset);
    tapTempo._reset = setTimeout(() => {
        tapIntervals = [];
        lastTapTime  = 0;
        hint.textContent = '';
    }, TAP_RESET_MS);
}

// ══════════════════════════════════════════════
//  SUBDIVISIÓN · VOLUMEN · COMPASES · ENTRENADOR
// ══════════════════════════════════════════════
// Clic de subdivisión: corto y suave, para no confundirse con el pulso
function scheduleSubClick(time) {
    const c = tctx(); if (!c) return;
    const osc = c.createOscillator(), g = c.createGain();
    osc.frequency.value = 2400;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(0.22, time + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    osc.connect(g); g.connect(master());
    osc.start(time); osc.stop(time + 0.04);
}

function setSubdiv(n, btn) {
    subdiv = n;
    store.set('subdiv', n);
    document.querySelectorAll('#subGrid .sig-btn').forEach(b => b.classList.toggle('active', b === btn));
    if (transport) { transport.subdiv = n; transport.resetStep(0); }   // el acento vuelve al tiempo 1
}

function setVolume(v) {
    volume = v / 100;
    store.set('volume', v);
    const m = master();
    if (m) m.gain.setTargetAtTime(volume, m.context.currentTime, 0.02);
}

// Se llama al empezar cada compás (desde el reloj de audio)
function onNewBar() {
    barCount++;
    if (!trainer.on) return;
    trainer.bars++;
    const every = Math.max(1, +document.getElementById('trBars').value || 4);
    const inc   = Math.max(1, +document.getElementById('trInc').value || 5);
    const max   = Math.max(30, +document.getElementById('trMax').value || 160);
    if (trainer.bars % every === 0 && bpm < max) {
        setBpm(Math.min(max, bpm + inc));
        renderPresets();
    }
    updateTrainerStatus();
}

function toggleTrainer(force) {
    trainer.on = force !== undefined ? force : !trainer.on;
    trainer.bars = 0;
    trainer.startBpm = isPlaying ? bpm : 0;
    const btn = document.getElementById('trainerBtn');
    btn.classList.toggle('on', trainer.on);
    btn.textContent = trainer.on ? 'Activado' : 'Apagado';
    updateTrainerStatus();
}

function updateTrainerStatus() {
    const el = document.getElementById('trainerStatus');
    if (!trainer.on) { el.textContent = ''; return; }
    const max = +document.getElementById('trMax').value || 160;
    el.textContent = !isPlaying
        ? `Empieza en ${bpm} BPM y sube ${document.getElementById('trInc').value} cada ${document.getElementById('trBars').value} compases`
        : bpm >= max ? `Llegaste a ${max} BPM 🎯 · ${barCount} compases` : `Ahora ${bpm} BPM · meta ${max} BPM`;
}

// ══════════════════════════════════════════════
//  COMPÁS
// ══════════════════════════════════════════════
function setTimeSig(beats, unit, btn) {
    beatsPerBar = beats;
    beatUnit    = unit;
    store.set('sig', beats + '/' + unit);        // solo informativo: el BPM es siempre la
                               // velocidad del clic, en cualquier compás
    currentBeat = 0;
    if (transport) transport.resetStep(0);   // el acento vuelve al tiempo 1

    document.querySelectorAll('.sig-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    renderBeatDots();
}

// ══════════════════════════════════════════════
//  FLASH DE BEAT
// ══════════════════════════════════════════════
function flashBeat(beatIdx) {
    const dots = document.querySelectorAll('.beat-dot');
    dots.forEach(d => d.classList.remove('active'));
    if (dots[beatIdx]) {
        dots[beatIdx].classList.add('active');
    }
}

// ══════════════════════════════════════════════
//  RENDER UI
// ══════════════════════════════════════════════
function renderBeatDots() {
    const container = document.getElementById('beatDots');
    container.innerHTML = '';
    for (let i = 0; i < beatsPerBar; i++) {
        const dot = document.createElement('div');
        dot.className = 'beat-dot' + (beatGroupStarts().includes(i) ? ' accent' : '');
        container.appendChild(dot);
    }
}

function renderPresets() {
    const grid = document.getElementById('presetGrid');
    const currentPreset = TEMPO_PRESETS.find(p => bpm >= p.min && bpm < p.max)
                       || TEMPO_PRESETS[TEMPO_PRESETS.length - 1];

    grid.innerHTML = TEMPO_PRESETS.map(p =>
        `<button class="preset-btn${p.name === currentPreset.name ? ' active' : ''}"
                 data-name="${p.name}"
                 onclick="setBpm(${p.bpm}); renderPresets();">
            <span class="preset-name">${p.name}</span>
            <span class="preset-range">${p.min}–${p.max}</span>
        </button>`
    ).join('');
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
// Ajustes recordados entre visitas (BPM y compás)
setBpm(store.get('bpm', 120));
const savedSig = [...document.querySelectorAll('.sig-btn')].find(b => b.textContent.trim() === store.get('sig', '4/4'));
if (savedSig) savedSig.click(); else renderBeatDots();
renderPresets();
const subBtn = document.querySelectorAll('#subGrid .sig-btn')[[1,2,3,4].indexOf(store.get('subdiv', 1))];
if (subBtn) setSubdiv(store.get('subdiv', 1), subBtn);
document.getElementById('volSlider').value = store.get('volume', 80);
setVolume(store.get('volume', 80));
store.bindInputs(['trInc', 'trBars', 'trMax']);
['trInc', 'trBars', 'trMax'].forEach(id => document.getElementById(id).addEventListener('input', updateTrainerStatus));
if (new URLSearchParams(location.search).has('entrenador')) {
    toggleTrainer(true);
    setTimeout(() => document.getElementById('trainerCard').scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
}
</script>
<script src="../../shared/shell.js"></script>
