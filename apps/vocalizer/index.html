<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Vocalizer - MusicTools</title>
    <script src="https://cdn.jsdelivr.net/npm/soundfont-player/dist/soundfont-player.js"></script>
    <script src="../../shared/sound-engine.js"></script>
    <script src="../../shared/transport.js"></script>
    <script src="../../shared/note-player.js"></script>
    <script src="../../shared/theory.js"></script>
    <link rel="stylesheet" href="../../shared/design.css">
    <style>
        /* ── Layout root ─────────────────────────── */
        .voc-screen {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 12px 0 200px;   /* space for floating transport */
            color: var(--ink);
        }

        /* ── Giant note display ──────────────────── */
        .voc-hero {
            text-align: center;
            padding-top: 4px;
        }
        .voc-note-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .voc-note-big {
            font-family: var(--font-head);
            font-size: clamp(80px, 22vw, 120px);
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--ink);
            text-shadow: none;
            transition: color 0.25s ease, text-shadow 0.25s ease;
            font-variant-numeric: tabular-nums;
        }
        .voc-note-big.playing {
            color: var(--accent);
            text-shadow: var(--accent-glow);
        }
        .voc-vocal-row {
            font-size: 16px;
            color: var(--ink-dim);
            margin-top: 6px;
            font-weight: 500;
        }
        .voc-vocal-row span {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            transition: color 0.2s;
        }
        .voc-progress-tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        /* ── Radial SVG display ──────────────────── */
        .voc-radial-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .voc-radial-wrap svg {
            max-width: 300px;
            width: 100%;
        }

        /* ── Stepper display ─────────────────────── */
        .voc-stepper {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 4px 0;
        }
        .voc-step {
            width: 36px;
            height: 52px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-head);
            font-size: 11px;
            font-weight: 700;
            transition: all 0.22s ease;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
        }
        .voc-step.played {
            background: var(--surface-s);
            color: var(--ink);
        }
        .voc-step.active {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: transparent;
            box-shadow: var(--accent-shadow);
            transform: translateY(-6px);
        }

        /* ── Layout toggle pills ─────────────────── */
        .voc-layout-toggle {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .voc-layout-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.15s;
        }
        .voc-layout-btn.active {
            background: rgba(var(--accent-rgb), 0.16);
            border-color: rgba(var(--accent-rgb), 0.35);
            color: var(--accent);
        }

        /* ── Config chips grid (2×2) ─────────────── */
        .voc-chips {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .voc-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-radius: var(--radius-sm);
            background: var(--surface);
            border: 1px solid var(--border);
            -webkit-backdrop-filter: blur(18px);
            backdrop-filter: blur(18px);
            box-shadow: var(--card-shadow);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            position: relative;
        }
        .voc-chip:hover {
            background: var(--surface-s);
            border-color: rgba(var(--accent-rgb), 0.25);
        }
        .voc-chip-icon {
            width: 34px; height: 34px;
            border-radius: 9px;
            background: rgba(var(--accent-rgb), 0.14);
            border: 1px solid rgba(var(--accent-rgb), 0.25);
            color: var(--accent);
            display: grid; place-items: center;
            flex-shrink: 0;
        }
        .voc-chip-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .voc-chip-val {
            font-family: var(--font-head);
            font-size: 13px;
            font-weight: 700;
            color: var(--ink);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── Config panel (expandable) ───────────── */
        .voc-config-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: var(--radius-pill);
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--ink-dim);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-sans);
            transition: all 0.15s;
            margin: 0 auto;
        }
        .voc-config-toggle:hover {
            background: var(--surface-s);
            color: var(--ink);
        }
        .voc-config-toggle svg {
            transition: transform 0.25s;
        }
        .voc-config-toggle.open svg {
            transform: rotate(180deg);
        }

        .voc-config-panel {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .voc-config-panel.open {
            display: flex;
        }

        .preset-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        input[type="range"] { width: 100%; margin-top: 6px; accent-color: var(--accent); }

        /* ── Floating transport bar ──────────────── */
        .voc-transport {
            position: fixed;
            bottom: calc(var(--bottomnav-h) + 12px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--nav-bg);
            -webkit-backdrop-filter: blur(26px);
            backdrop-filter: blur(26px);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        @media (min-width: 960px) {
            .voc-transport {
                position: static;
                transform: none;
                background: transparent;
                border: none;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
                justify-content: center;
                padding: 0;
                margin-top: 4px;
            }
        }

        .voc-play-btn {
            width: 84px; height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: var(--accent-ink);
            border: none;
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: var(--accent-shadow);
            transition: transform 0.12s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .voc-play-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--accent-glow), var(--accent-shadow);
        }
        .voc-play-btn:active { transform: scale(0.95); }

        .voc-play-btn.loading {
            opacity: 0.7;
            cursor: wait;
        }

        /* Stop: solo aparece con el ejercicio en marcha o en pausa */
        .voc-stop-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--surface-s);
            border: 1px solid var(--border);
            color: var(--danger);
            cursor: pointer;
            display: none;
            place-items: center;
            flex-shrink: 0;
            transition: transform 0.12s;
        }
        .voc-stop-btn.show { display: grid; }
        .voc-stop-btn:active { transform: scale(0.92); }

        /* Estado del motor de audio */
        .voc-engine {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            margin-left: 6px;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-sans);
            cursor: pointer;
        }
        .voc-engine-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--muted);
        }
        .voc-engine[data-kind="ok"]   .voc-engine-dot { background: var(--success); }
        .voc-engine[data-kind="wait"] .voc-engine-dot { background: var(--warning); animation: voc-blink 1s infinite; }
        .voc-engine[data-kind="bad"]  { color: var(--danger); border-color: var(--danger); }
        .voc-engine[data-kind="bad"]  .voc-engine-dot { background: var(--danger); }
        @keyframes voc-blink { 50% { opacity: 0.3; } }

        /* Aviso: ajuste cambiado durante el ejercicio */
        .voc-live-hint {
            display: none;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--warning);
        }
        .voc-live-hint.show { display: block; }

        /* Progreso dentro del rango: C4 ●━━━○ F4 · 3/6 */
        .voc-range {
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 280px;
            margin: 10px auto 0;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            font-family: var(--font-head);
        }
        .voc-range[hidden] { display: none; }
        .voc-range-track {
            position: relative;
            flex: 1;
            height: 4px;
            border-radius: 2px;
            background: var(--border);
        }
        .voc-range-fill {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            border-radius: 2px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        .voc-range-dot {
            position: absolute;
            top: 50%;
            width: 12px; height: 12px;
            margin: -6px 0 0 -6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: var(--accent-glow);
            transition: left 0.3s ease;
        }
        .voc-range-count { color: var(--ink-dim); min-width: 34px; text-align: right; }

        .voc-range-warn {
            display: none;
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.4;
            color: var(--warning);
        }
        .voc-range-warn.show { display: block; }

        .voc-semitone {
            font-family: var(--font-head);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .voc-side-btn {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: var(--surface-s);
            border: 1px solid var(--border);
            color: var(--ink);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.12s;
            flex-shrink: 0;
        }
        .voc-side-btn:hover {
            background: var(--surface-ss);
            border-color: rgba(var(--accent-rgb), 0.3);
            color: var(--accent);
        }
        .voc-side-btn:active { transform: scale(0.95); }
        .voc-side-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body data-tool-name="Vocalizer" data-page-id="vocalizer">

<div class="voc-screen">

    <!-- ── Giant note display ── -->
    <div class="voc-hero">
        <div class="voc-note-label">Nota actual</div>
        <div class="voc-note-big" id="currentNote">—</div>
        <div class="voc-vocal-row">
            Vocal · <span id="currentVowel">—</span>
        </div>
        <div class="voc-progress-tag" id="progressInfo">Selecciona y presiona ▶</div>
        <button type="button" class="voc-engine" id="engineStatus" data-kind="wait" onclick="onEngineStatusTap()">
            <span class="voc-engine-dot"></span><span id="engineText">Audio sin iniciar</span>
        </button>
        <div class="voc-live-hint" id="liveHint" role="status"></div>
        <div class="voc-range" id="rangeBar" hidden>
            <span id="rangeLo">—</span>
            <div class="voc-range-track">
                <div class="voc-range-fill" id="rangeFill"></div>
                <div class="voc-range-dot" id="rangeDot"></div>
            </div>
            <span id="rangeHi">—</span>
            <span class="voc-range-count" id="rangeCount"></span>
        </div>
    </div>

    <!-- ── Layout toggle ── -->
    <div class="voc-layout-toggle">
        <button class="voc-layout-btn active" id="btnRadial" onclick="setLayout('radial')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
            Radial
        </button>
        <button class="voc-layout-btn" id="btnStepper" onclick="setLayout('stepper')">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="4" height="8" rx="1"/><rect x="8" y="5" width="4" height="11" rx="1"/><rect x="14" y="8" width="4" height="8" rx="1"/><rect x="20" y="10" width="2" height="6" rx="1"/></svg>
            Pasos
        </button>
    </div>

    <!-- ── Radial SVG display ── -->
    <div class="voc-radial-wrap" id="radialWrap">
        <svg id="radialSvg" viewBox="0 0 300 300" width="300" height="300"></svg>
    </div>

    <!-- ── Stepper display (hidden by default) ── -->
    <div class="voc-stepper" id="stepperWrap" style="display:none;"></div>

    <!-- ── Config chips (2×2) ── -->
    <div class="voc-chips" onclick="toggleConfig()">
        <div class="voc-chip">
            <div class="voc-chip-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            </div>
            <div>
                <div class="voc-chip-label">Tesitura</div>
                <div class="voc-chip-val" id="chipTesitura">Soprano</div>
            </div>
        </div>
        <div class="voc-chip">
            <div class="voc-chip-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12h2l2-6 3 12 3-9 2 3h3"/></svg>
            </div>
            <div>
                <div class="voc-chip-label">Patrón</div>
                <div class="voc-chip-val" id="chipPattern">Tríada</div>
            </div>
        </div>
        <div class="voc-chip">
            <div class="voc-chip-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l3 18H5z"/><path d="M13 21 9 7"/></svg>
            </div>
            <div>
                <div class="voc-chip-label">BPM</div>
                <div class="voc-chip-val" id="chipBpm">100</div>
            </div>
        </div>
        <div class="voc-chip">
            <div class="voc-chip-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18V8l3 10M4 14h4M10 8v10c0 0 4 0 4-2s-4-1-4-1c0 0 4 0 4-2s-4-2-4-2M17 13a2 2 0 1 1 4 0v2a2 2 0 1 1-4 0z"/></svg>
            </div>
            <div>
                <div class="voc-chip-label">Vocales</div>
                <div class="voc-chip-val" id="chipVowels">Ma·Me·Mi</div>
            </div>
        </div>
    </div>

    <!-- ── Config toggle ── -->
    <button class="voc-config-toggle" id="configToggle" onclick="toggleConfig()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configurar ejercicio
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>

    <!-- ── Config panel ── -->
    <div class="voc-config-panel" id="configPanel">

        <div class="section-card">
            <div class="section-title">Tesitura</div>
            <div class="preset-grid">
                <button class="btn-mini" onclick="setVoicePreset('soprano')">Soprano</button>
                <button class="btn-mini" onclick="setVoicePreset('mezzosoprano')">Mezzo</button>
                <button class="btn-mini" onclick="setVoicePreset('alto')">Alto</button>
                <button class="btn-mini" onclick="setVoicePreset('tenor')">Tenor</button>
                <button class="btn-mini" onclick="setVoicePreset('baritone')">Barítono</button>
                <button class="btn-mini" onclick="setVoicePreset('bass')">Bajo</button>
            </div>
            <div class="grid-2" style="margin-top:10px">
                <div><label>Inicio</label><select id="startNote"></select></div>
                <div><label>Fin</label><select id="endNote"></select></div>
            </div>
            <div class="voc-range-warn" id="rangeWarn"></div>
        </div>

        <div class="section-card">
            <div class="section-title">Ejercicio</div>
            <label>Tipo de patrón</label>
            <select id="pattern" onchange="updateChips()">
                <option value="scale">Escala Lineal</option>
                <option value="triad" selected>Tríada (I-III-V-III-I)</option>
                <option value="octave">Octava (I-V-VIII-V-I)</option>
                <option value="arpeggio">Arpegio (I-III-V-VIII-V-III-I)</option>
                <option value="messa">Messa di Voce (Sostenido)</option>
            </select>
            <div id="scaleGroup" style="margin-top:10px">
                <label>Escala</label>
                <select id="scale">
                    <option value="major">Mayor</option>
                    <option value="minor">Menor</option>
                </select>
            </div>
            <div style="margin-top:10px">
                <label>Referencia antes de cada repetición</label>
                <select id="reference">
                    <option value="none">Ninguna</option>
                    <option value="note">Nota base</option>
                    <option value="chord">Acorde</option>
                </select>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">Vocales</div>
            <select id="vowelPattern" onchange="updateChips()">
                <option value="a">Solo A</option>
                <option value="aeiou">A - E - I - O - U</option>
                <option value="mama" selected>Ma - Me - Mi - Mo - Mu</option>
            </select>
        </div>

        <div class="section-card">
            <div class="section-title">Ajustes</div>
            <label>Modo</label>
            <select id="practiceMode">
                <option value="single">Tocar una vez</option>
                <option value="loop">Subir Automático</option>
                <option value="loop-desc">Bajar Automático</option>
                <option value="cycle">Cíclico (↑↓ infinito)</option>
            </select>
            <div class="grid-2" style="margin-top:10px">
                <div>
                    <label>BPM: <span id="bpmVal">100</span></label>
                    <input type="range" id="tempo" min="60" max="180" value="100">
                </div>
                <div>
                    <label>Metrónomo</label>
                    <div class="toggle-row">
                        <button class="toggle-btn active" id="mOff" onclick="setMet(false)">Off</button>
                        <button class="toggle-btn" id="mOn" onclick="setMet(true)">On</button>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /config panel -->

</div><!-- /voc-screen -->

<!-- ── Floating transport ── -->
<div class="voc-transport">
    <button class="voc-side-btn" id="prevBtn" onclick="shiftNote(-1)" disabled aria-label="Bajar medio tono">
        <span class="voc-semitone">−½</span>
    </button>

    <button class="voc-play-btn" id="playBtn" onclick="handlePlayBtn()" aria-label="Reproducir">
        <svg id="playIcon" width="34" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="m8 5 12 7-12 7z"/></svg>
    </button>

    <button class="voc-side-btn" id="nextBtn" onclick="shiftNote(1)" disabled aria-label="Subir medio tono">
        <span class="voc-semitone">+½</span>
    </button>

    <button class="voc-stop-btn" id="stopBtn" onclick="stopExercise()" disabled aria-label="Detener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>
    </button>
</div>

<script src="../../shared/audio-utils.js"></script>
<script>
/* ════════════════════════════════════════════════════
   DATOS
   ════════════════════════════════════════════════════ */
const notes = getAllNotes(2, 6);
const scales = {
    major: [0,2,4,5,7,9,11,12],
    minor: [0,2,3,5,7,8,10,12]
};
const patterns = {
    scale:   [0,1,2,3,4,5,6,7,6,5,4,3,2,1,0],
    triad:   [0,2,4,2,0],
    octave:  [0,4,7,4,0],
    arpeggio:[0,2,4,7,4,2,0],
    messa:   [0]
};
const vowelSets = {
    a:    ['A'],
    aeiou:['A','E','I','O','U'],
    mama: ['Ma','Me','Mi','Mo','Mu']
};
const voicePresets = {
    soprano:      ['C4','C6'], mezzosoprano:['A3','A5'], alto:['F3','F5'],
    tenor:        ['C3','C5'], baritone:    ['G2','G4'], bass:['E2','E4']
};
const patternLabels = {
    scale:'Escala', triad:'Tríada', octave:'Octava', arpeggio:'Arpegio', messa:'Messa'
};
const vowelLabels = {
    a:'Solo A', aeiou:'A·E·I·O·U', mama:'Ma·Me·Mi'
};

/* ════════════════════════════════════════════════════
   ESTADO
   ════════════════════════════════════════════════════ */
let metEnabled      = false;
let currentSequence = [];   // notes being played this sequence
let currentStepIdx  = -1;   // index in currentSequence
let currentLayout   = 'radial';
let currentPresetName = null; // set when a voice preset is active, null when custom range

/* ════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════ */
function init() {
    const s = document.getElementById('startNote');
    const e = document.getElementById('endNote');
    notes.forEach((n, i) => {
        s.options.add(new Option(n, i));
        e.options.add(new Option(n, i));
    });
    s.value = 24; e.value = 48;  // default C4 → C5
    s.onchange = () => { currentPresetName = null; updateChips(); };
    e.onchange = () => { currentPresetName = null; updateChips(); };

    document.getElementById('tempo').oninput = ev => {
        document.getElementById('bpmVal').innerText = ev.target.value;
        updateChips();
    };

    // Cualquier ajuste tocado durante el ejercicio avisa cuándo se aplica
    const panel = document.getElementById('configPanel');
    panel.addEventListener('change', onConfigChanged);
    panel.addEventListener('change', updateChips);
    panel.addEventListener('input',  onConfigChanged);
    panel.addEventListener('click',  ev => { if (ev.target.closest('.btn-mini')) onConfigChanged(ev); });

    // Descargar el piano ya, para que el primer ▶ no espere a la red
    player.onStatus(renderEngineStatus);
    player.preload().catch(() => {});

    // Build initial radial with a preview sequence
    buildPreviewDisplay();
    updateChips();
}

/* ════════════════════════════════════════════════════
   LAYOUT SWITCH (Radial / Stepper)
   ════════════════════════════════════════════════════ */
function setLayout(layout) {
    currentLayout = layout;
    document.getElementById('btnRadial').classList.toggle('active',   layout === 'radial');
    document.getElementById('btnStepper').classList.toggle('active', layout === 'stepper');
    document.getElementById('radialWrap').style.display  = layout === 'radial'  ? 'flex' : 'none';
    document.getElementById('stepperWrap').style.display = layout === 'stepper' ? 'flex' : 'none';
    if (currentSequence.length) {
        renderDisplay(currentSequence, currentStepIdx);
    } else {
        buildPreviewDisplay();
    }
}

/* ════════════════════════════════════════════════════
   DISPLAY BUILDERS
   ════════════════════════════════════════════════════ */
function buildPreviewDisplay() {
    // Show a static preview (triads in C4) before exercise starts
    const preview = ['C4','E4','G4','E4','C4'];
    renderDisplay(preview, -1);
}

function renderDisplay(seq, activeIdx) {
    if (currentLayout === 'radial') {
        renderRadial(seq, activeIdx);
    } else {
        renderStepper(seq, activeIdx);
    }
}

/* ── Radial SVG ─────────────────────────────────── */
/* Leer variables CSS fuerza un recálculo de estilos: se leen una vez por
   tema, no en cada nota (en teléfonos modestos causaba tirones). */
let themeColors = null;
function getThemeColors() {
    if (!themeColors) {
        const cs = getComputedStyle(document.documentElement);
        const v  = name => cs.getPropertyValue(name).trim();
        themeColors = {
            accent: v('--accent'), border: v('--border'), muted: v('--muted'),
            accentInk: v('--accent-ink'), surface: v('--surface')
        };
        themeColors.accentRgb = hexToRgb(themeColors.accent);
    }
    return themeColors;
}

let lastRadialKey = '';
function renderRadial(seq, activeIdx) {
    const key = seq.join(',') + '|' + activeIdx;
    if (key === lastRadialKey) return;
    lastRadialKey = key;

    const svg    = document.getElementById('radialSvg');
    const CX     = 150, CY = 150, R = 105;
    const { accent, border, muted, accentInk, surface, accentRgb } = getThemeColors();

    // Unique set for display (remove duplicates keeping order)
    const unique = [...new Set(seq)];
    const n      = unique.length;

    let html = '';

    // Dashed orbit circle
    html += `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${border}" stroke-width="1" stroke-dasharray="3 5"/>`;

    // Center circle
    const centerNote = activeIdx >= 0 ? seq[activeIdx] : (unique[Math.floor(n/2)] || '—');
    html += `<circle cx="${CX}" cy="${CY}" r="52" fill="${surface}" stroke="${border}" stroke-width="1"/>`;
    html += `<text x="${CX}" y="${CY - 6}" text-anchor="middle" font-size="10" font-weight="700" fill="${muted}" letter-spacing="1.5" font-family="Inter,sans-serif">SUENA</text>`;
    html += `<text x="${CX}" y="${CY + 22}" text-anchor="middle" font-size="26" font-weight="800" fill="${accent}" font-family="var(--font-head, 'Space Grotesk', sans-serif)">${centerNote}</text>`;

    // Node for each unique note
    unique.forEach((note, i) => {
        const angle    = (i / n) * Math.PI * 2 - Math.PI / 2;
        const x        = CX + Math.cos(angle) * R;
        const y        = CY + Math.sin(angle) * R;
        const isActive = seq[activeIdx] === note;
        const playedIdx = activeIdx >= 0 ? seq.slice(0, activeIdx + 1).lastIndexOf(note) : -1;
        const isPlayed  = playedIdx >= 0 && !isActive;

        if (isActive) {
            // Halo
            html += `<circle cx="${x}" cy="${y}" r="26" fill="${accent}" opacity="0.2"/>`;
        }
        const r   = isActive ? 19 : 13;
        const bg  = isActive ? accent : isPlayed ? `rgba(${accentRgb},0.15)` : 'none';
        const str = isActive ? 'none' : isPlayed ? `rgba(${accentRgb},0.4)` : border;
        html += `<circle cx="${x}" cy="${y}" r="${r}" fill="${bg}" stroke="${str}" stroke-width="1.5"/>`;
        const textFill = isActive ? accentInk : isPlayed ? accent : muted;
        const fs = isActive ? '12' : '10';
        html += `<text x="${x}" y="${y + Number(fs)/2 - 1}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="${textFill}" font-family="Inter,sans-serif">${note}</text>`;
    });

    svg.innerHTML = html;
}

/* ── Stepper ────────────────────────────────────── */
let lastStepperSeq = '';
function renderStepper(seq, activeIdx) {
    const wrap = document.getElementById('stepperWrap');
    // Reconstruir solo cuando cambia la secuencia; en cada nota, solo clases.
    const key = seq.join(',');
    if (key !== lastStepperSeq || wrap.children.length !== seq.length) {
        lastStepperSeq = key;
        wrap.innerHTML = seq.map(note => `<div class="voc-step">${note}</div>`).join('');
    }
    [...wrap.children].forEach((el, i) => {
        el.classList.toggle('active', i === activeIdx);
        el.classList.toggle('played', i < activeIdx);
    });
}

/* ── Helper ── */
function hexToRgb(hex) {
    const h = hex.replace('#','');
    const r = parseInt(h.slice(0,2),16);
    const g = parseInt(h.slice(2,4),16);
    const b = parseInt(h.slice(4,6),16);
    return `${r},${g},${b}`;
}

/* ════════════════════════════════════════════════════
   CONFIG CHIPS UPDATE
   ════════════════════════════════════════════════════ */
function buildTesituraLabel() {
    const startIdx  = parseInt(document.getElementById('startNote').value);
    const endIdx    = parseInt(document.getElementById('endNote').value);
    const startNote = notes[startIdx] || '—';
    const endNote   = notes[endIdx]   || '—';
    const semitones = Math.max(0, endIdx - startIdx);

    let octStr = '';
    if (semitones > 0) {
        const halves = Math.round(semitones / 6);
        if (halves > 0) {
            const full    = Math.floor(halves / 2);
            const hasHalf = (halves % 2) === 1;
            if (full === 0)     octStr = '½ oct';
            else if (!hasHalf)  octStr = full + ' oct';
            else                octStr = full + '½ oct';
        }
    }

    const range = `${startNote}–${endNote}`;
    if (currentPresetName) {
        return `${currentPresetName} · ${range}`;
    }
    return octStr ? `${range} (${octStr})` : range;
}

function updateRangeWarning() {
    const c    = readConfig();
    const span = patternSpan(c);
    const warn = document.getElementById('rangeWarn');
    const short = c.end - c.start < span;
    warn.classList.toggle('show', short);
    if (short) {
        warn.textContent = `⚠ El rango ${notes[c.start]}–${notes[c.end]} es más corto que el patrón ` +
            `(necesita ${span} semitonos): se repetirá solo ${notes[c.start]} y el patrón pasará de ${notes[c.end]}.`;
    }
}

function updateChips() {
    updateRangeWarning();
    const patternEl = document.getElementById('pattern');
    const vowelEl   = document.getElementById('vowelPattern');
    const bpmEl     = document.getElementById('tempo');

    document.getElementById('chipTesitura').textContent = buildTesituraLabel();
    document.getElementById('chipPattern').textContent  = patternLabels[patternEl.value] || patternEl.value;
    document.getElementById('chipBpm').textContent      = bpmEl.value + ' bpm';
    document.getElementById('chipVowels').textContent   = vowelLabels[vowelEl.value] || vowelEl.value;
}

/* ════════════════════════════════════════════════════
   CONFIG PANEL TOGGLE
   ════════════════════════════════════════════════════ */
function toggleConfig() {
    const panel  = document.getElementById('configPanel');
    const toggle = document.getElementById('configToggle');
    const open   = panel.classList.toggle('open');
    toggle.classList.toggle('open', open);
}

/* ════════════════════════════════════════════════════
   PRESETS
   ════════════════════════════════════════════════════ */
function setVoicePreset(v) {
    document.getElementById('startNote').value = notes.indexOf(voicePresets[v][0]);
    document.getElementById('endNote').value   = notes.indexOf(voicePresets[v][1]);
    const labels = { soprano:'Soprano', mezzosoprano:'Mezzo', alto:'Alto', tenor:'Tenor', baritone:'Barítono', bass:'Bajo' };
    currentPresetName = labels[v];
    updateChips();
}

function setMet(v) {
    metEnabled = v;
    document.getElementById('mOn').classList.toggle('active',  v);
    document.getElementById('mOff').classList.toggle('active', !v);
}

/* ════════════════════════════════════════════════════
   TRANSPORT — PLAY / PAUSA / STOP / SHIFT
   ────────────────────────────────────────────────────
   Estados: idle → loading → playing ⇄ paused → idle
   · transport.js decide CUÁNDO (un paso = una nota, BPM leído en vivo).
   · note-player.js toca las notas y sincroniza la pantalla al audio.
   · Los ajustes se releen al empezar cada repetición: cambiar patrón,
     vocales, tesitura o modo no obliga a detener el ejercicio.
   ════════════════════════════════════════════════════ */
const player      = createNotePlayer('acoustic_grand_piano');
const playNotes   = getAllNotes(1, 7);   // rango ampliado: los patrones suben hasta una octava
const PLAY_OFFSET = 12;                  // notes[i] === playNotes[i + PLAY_OFFSET]
const GAP_STEPS   = 2;                   // pasos de silencio entre repeticiones

let state          = 'idle';
let transport      = null;
let currentConfig  = null;
let currentBaseIdx = 0;
let cycleDir       = 1;       // 1 = sube, -1 = baja
let seq            = [];      // notas de la repetición en curso
let seqCursor      = 0;       // posición en seq (+ pasos de silencio)
let finishing      = false;   // el modo terminó; se para al acabar el silencio

function readConfig() {
    const c = {
        start:   parseInt(document.getElementById('startNote').value),
        end:     parseInt(document.getElementById('endNote').value),
        pattern: document.getElementById('pattern').value,
        scale:   document.getElementById('scale').value,
        vowels:  document.getElementById('vowelPattern').value,
        mode:    document.getElementById('practiceMode').value,
        ref:     document.getElementById('reference').value
    };
    if (c.end < c.start) [c.start, c.end] = [c.end, c.start];
    return c;
}

/* La nota más aguda del patrón no debe pasar de "Fin": la base sube
   como máximo hasta Fin − (salto del patrón). */
function patternSpan(config) {
    const scaleInt = scales[config.scale];
    return Math.max(...patterns[config.pattern].map(g => scaleInt[g % 8] + Math.floor(g / 8) * 12));
}
function baseBounds(config) {
    const lo = config.start;
    const hi = Math.max(lo, config.end - patternSpan(config));
    return { lo, hi };
}

function buildSequence(baseNoteIdx, config) {
    const scaleInt = scales[config.scale];
    return patterns[config.pattern].map(grade => {
        const semitoneJump = scaleInt[grade % 8] + Math.floor(grade / 8) * 12;
        return playNotes[baseNoteIdx + PLAY_OFFSET + semitoneJump];
    });
}

/* Nombres para MOSTRAR, escritos según la tonalidad de la base (tríada de
   Mi♭: E♭–G–B♭, no D#–G–A#). El audio sigue usando los nombres de playNotes. */
function baseKey(baseIdx, config) {
    const type = config && config.scale === 'minor' ? 'minor' : 'major';
    return { key: Theory.bestScaleRoot(baseIdx % 12, type), type };
}
function baseLabel(baseIdx, config = currentConfig) {
    const oct = notes[baseIdx].replace(/^\D+/, '');
    return Theory.display(baseKey(baseIdx, config).key + oct, 'en');
}
function spelledSeq(sequence, baseIdx, config = currentConfig) {
    const { key, type } = baseKey(baseIdx, config);
    const byPc = {};
    Theory.scale(key, type).notes.forEach(n => { byPc[Theory.pc(n)] = n; });
    return sequence.map(n => {
        const p = Theory.parse(n);
        const name = byPc[p.pc] || n.replace(/\d+$/, '');
        // La octava sigue a la letra: B♯3 suena como C4
        const oct = p.octave + (name[0] === 'B' && p.pc === 0 ? -1 : 0) + (name[0] === 'C' && p.pc === 11 ? 1 : 0);
        return Theory.display(name + oct, 'en');
    });
}

// Siguiente nota base según el modo, o 'stop' al terminar.
function nextBase() {
    const c = currentConfig;
    const { lo, hi } = baseBounds(c);
    // Si la tesitura cambió en vivo y la base quedó fuera, volver al rango.
    if (currentBaseIdx > hi) return hi;
    if (currentBaseIdx < lo) return lo;
    if (c.mode === 'single') return 'stop';
    if (c.mode === 'cycle') {
        if (hi === lo) return lo;
        if (currentBaseIdx + cycleDir > hi) cycleDir = -1;
        if (currentBaseIdx + cycleDir < lo) cycleDir =  1;
        return currentBaseIdx + cycleDir;
    }
    if (c.mode === 'loop')      cycleDir =  1;
    if (c.mode === 'loop-desc') cycleDir = -1;
    const nx = currentBaseIdx + cycleDir;
    return (nx > hi || nx < lo) ? 'stop' : nx;
}

// Pasos de silencio tras la repetición. Con referencia ya hay una pausa
// antes de cantar, así que basta uno. Messa di voce sostiene 4 s.
function gapSteps(stepDur) {
    const gap = currentConfig.ref !== 'none' ? 1 : GAP_STEPS;
    if (currentConfig.pattern !== 'messa') return gap;
    return Math.ceil(4 / stepDur) - 1 + gap;
}

// Referencia: 1 paso sonando + 1 para respirar antes de la repetición.
function refSteps() {
    return currentConfig.ref === 'none' ? 0 : 2;
}

function playReference(time, stepDur) {
    const c = currentConfig, base = currentBaseIdx;
    const root = base + PLAY_OFFSET, sc = scales[c.scale];
    const offsets = c.ref === 'chord' ? [0, sc[2], sc[4]] : [0];
    offsets.forEach(o => player.note(playNotes[root + o], time, { dur: stepDur * 1.7, gain: 0.7 }));
    player.ui(time, () => {
        document.getElementById('currentNote').innerText  = baseLabel(base, c);
        document.getElementById('currentVowel').innerText = '…';
        document.getElementById('progressInfo').innerText = `Referencia · ${baseLabel(base, c)}${c.ref === 'chord' ? ' (acorde)' : ''}`;
    });
}

/* Barra "C4 ●━━━○ F4 · 3/6": dónde va el ejercicio dentro del rango. */
function renderRangeBar(base) {
    const bar = document.getElementById('rangeBar');
    if (!currentConfig || base == null) { bar.hidden = true; return; }
    const { lo, hi } = baseBounds(currentConfig);
    const total = hi - lo + 1;
    const pos   = Math.min(hi, Math.max(lo, base)) - lo;
    const pct   = total > 1 ? (pos / (total - 1)) * 100 : 0;
    document.getElementById('rangeLo').textContent    = baseLabel(lo);
    document.getElementById('rangeHi').textContent    = baseLabel(hi);
    document.getElementById('rangeCount').textContent = `${pos + 1}/${total}`;
    document.getElementById('rangeFill').style.width  = pct + '%';
    document.getElementById('rangeDot').style.left    = pct + '%';
    bar.hidden = false;
}

function dirArrow() {
    const m = currentConfig.mode;
    if (m === 'single') return '';
    return cycleDir > 0 ? ' ↑' : ' ↓';
}

/* ── Reloj: un paso = una nota, agendado con el tiempo exacto de audio ── */
function vocOnStep(step, time, stepDur) {
    if (state !== 'playing' || finishing) return;

    // Fin de la repetición (+ silencio) → aplicar ajustes y pasar a la siguiente base.
    if (seqCursor >= seq.length + gapSteps(stepDur)) {
        currentConfig = readConfig();
        const nb = nextBase();
        if (nb === 'stop') {
            finishing = true;
            player.ui(time, () => stopExercise('Ejercicio completado ✓'));
            return;
        }
        currentBaseIdx = nb;
        seq = buildSequence(currentBaseIdx, currentConfig);
        seqCursor = -refSteps();
        const b = nb;
        player.ui(time, () => { showHint(''); renderRangeBar(b); });
    }

    const idx = seqCursor++;
    if (idx < 0) {                   // referencia antes de cantar
        if (idx === -refSteps()) playReference(time, stepDur);
        return;
    }
    if (idx >= seq.length) return;   // paso de silencio

    const note  = seq[idx];
    const dur   = currentConfig.pattern === 'messa' ? 4 : stepDur * 0.8;
    player.note(note, time, { dur, gain: 0.9 });
    if (metEnabled) player.click(time);

    const vowelList = vowelSets[currentConfig.vowels];
    const vowel = vowelList[idx % vowelList.length];
    const base  = currentBaseIdx;
    const arrow = dirArrow();
    const s     = spelledSeq(seq, currentBaseIdx);
    const label = s[idx];
    const baseTxt = baseLabel(base);
    player.ui(time, () => {
        currentSequence = s;
        currentStepIdx  = idx;
        document.getElementById('currentNote').innerText  = label;
        document.getElementById('currentVowel').innerText = vowel;
        document.getElementById('progressInfo').innerText = `Base: ${baseTxt}${arrow}`;
        renderDisplay(s, idx);
    });
}

function handlePlayBtn() {
    if      (state === 'idle')    startExercise();
    else if (state === 'playing') pauseExercise();
    else if (state === 'paused')  resumeExercise();
}

/* Prepara la repetición en la base actual y arranca el reloj. */
async function beginPlaying() {
    seq = buildSequence(currentBaseIdx, currentConfig);
    seqCursor = -refSteps();
    renderRangeBar(currentBaseIdx);
    finishing = false;
    currentSequence = seq;
    currentStepIdx  = -1;
    renderDisplay(spelledSeq(seq, currentBaseIdx), -1);
    showHint('');

    state = 'playing';
    setPlayBtnState('playing');
    soundEngine.keepAwake(true);   // que la pantalla no se apague mientras practicas
    document.getElementById('currentNote').classList.add('playing');

    if (!transport) {
        transport = createTransport({
            // BPM leído en vivo: mover el slider cambia el tempo al instante.
            getBpm: () => parseInt(document.getElementById('tempo').value) || 100,
            subdiv: 1,
            onStep: vocOnStep
        });
    }
    await transport.start();
}

async function startExercise() {
    state = 'loading';
    setPlayBtnState('loading');
    try {
        await player.ready();
    } catch (err) {
        console.error(err);
        state = 'idle';
        setPlayBtnState('idle');
        document.getElementById('progressInfo').innerText = 'No se pudo cargar el piano. Revisa tu conexión.';
        return;
    }
    if (state !== 'loading') return;   // se detuvo mientras cargaba

    currentConfig = readConfig();
    // "Bajar automático" empieza arriba; los demás modos, abajo.
    const { lo, hi } = baseBounds(currentConfig);
    const isDesc = currentConfig.mode === 'loop-desc';
    currentBaseIdx = isDesc ? hi : lo;
    cycleDir = isDesc ? -1 : 1;
    await beginPlaying();
}

function pauseExercise() {
    if (state !== 'playing') return;
    state = 'paused';
    if (transport) transport.stop();
    player.cancel();
    soundEngine.keepAwake(false);
    setPlayBtnState('paused');
    document.getElementById('currentNote').classList.remove('playing');
    document.getElementById('progressInfo').innerText = `En pausa · Base ${baseLabel(currentBaseIdx)}`;
    showHint('');
}

async function resumeExercise() {
    if (state !== 'paused') return;
    try { await player.ready(); } catch (_) { return; }
    // Retoma desde el inicio de la repetición en la misma base, con los ajustes actuales.
    currentConfig = readConfig();
    const { lo, hi } = baseBounds(currentConfig);
    currentBaseIdx = Math.min(hi, Math.max(lo, currentBaseIdx));
    await beginPlaying();
}

function stopExercise(message = 'Ejercicio detenido') {
    state     = 'idle';
    finishing = false;
    if (transport) transport.stop();
    player.cancel();
    soundEngine.keepAwake(false);

    setPlayBtnState('idle');
    showHint('');
    renderRangeBar(null);
    document.getElementById('currentNote').classList.remove('playing');
    document.getElementById('currentNote').innerText  = '—';
    document.getElementById('currentVowel').innerText = '—';
    document.getElementById('progressInfo').innerText = message;
    currentSequence = [];
    currentStepIdx  = -1;
    buildPreviewDisplay();
}

/* −½ / +½: en marcha salta ya a la nueva base; en pausa solo la elige. */
function shiftNote(delta) {
    if ((state !== 'playing' && state !== 'paused') || !currentConfig) return;
    currentConfig = readConfig();
    const { lo, hi } = baseBounds(currentConfig);
    const newIdx = currentBaseIdx + delta;
    if (newIdx < lo || newIdx > hi) { buzz(40); return; }

    currentBaseIdx = newIdx;
    if (currentConfig.mode === 'cycle') cycleDir = delta > 0 ? 1 : -1;
    buzz(12);
    renderRangeBar(currentBaseIdx);
    if (state === 'paused') {
        document.getElementById('progressInfo').innerText = `En pausa · Base ${baseLabel(currentBaseIdx)}`;
        renderDisplay(spelledSeq(buildSequence(currentBaseIdx, currentConfig), currentBaseIdx), -1);
        return;
    }
    player.cancel();
    finishing = false;
    seq = buildSequence(currentBaseIdx, currentConfig);
    seqCursor = -refSteps();
    renderDisplay(spelledSeq(seq, currentBaseIdx), -1);
}

function buzz(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
}

function setPlayBtnState(s) {
    const btn  = document.getElementById('playBtn');
    const icon = document.getElementById('playIcon');
    const active = s === 'playing' || s === 'paused';

    btn.classList.toggle('loading', s === 'loading');
    btn.setAttribute('aria-label', s === 'playing' ? 'Pausar' : s === 'paused' ? 'Continuar' : 'Reproducir');
    if (s === 'loading') {
        icon.innerHTML = '<circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="14" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle>';
    } else if (s === 'playing') {
        icon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/>';
    } else {
        icon.innerHTML = '<path d="m8 5 12 7-12 7z"/>';
    }
    document.getElementById('prevBtn').disabled = !active;
    document.getElementById('nextBtn').disabled = !active;
    document.getElementById('stopBtn').classList.toggle('show', active);
    document.getElementById('stopBtn').disabled = !active;
    renderEngineStatus();
}

/* ── Aviso de cambios en vivo ── */
function showHint(text) {
    const el = document.getElementById('liveHint');
    el.textContent = text;
    el.classList.toggle('show', !!text);
}

function onConfigChanged(ev) {
    if (state !== 'playing') return;
    const id = ev.target && ev.target.id;
    if (id === 'tempo') return;   // el BPM se aplica al instante
    showHint('Se aplica en la siguiente repetición');
}

/* ── Estado del motor de audio ── */
function renderEngineStatus() {
    const el  = document.getElementById('engineStatus');
    const txt = document.getElementById('engineText');
    let kind, label;
    switch (player.status) {
        case 'loading':
            kind = 'wait'; label = 'Cargando piano…'; break;
        case 'error':
            kind = 'bad';  label = 'Sin piano · toca para reintentar'; break;
        case 'suspended':
            // Antes del primer toque es normal; durante el ejercicio, el sistema cortó el audio.
            if (state === 'playing') { kind = 'bad'; label = 'Audio pausado por el sistema · toca para reanudar'; }
            else { kind = 'ok'; label = 'Piano listo'; }
            break;
        case 'ready': {
            const ms = player.latencyMs;
            kind = 'ok'; label = ms ? `Audio listo · ${ms} ms` : 'Audio listo';
            break;
        }
        default:
            kind = 'wait'; label = 'Audio sin iniciar';
    }
    el.dataset.kind = kind;
    txt.textContent = label;
}

function onEngineStatusTap() {
    if (player.status === 'error') player.preload().catch(() => {});
    else soundEngine.start();   // reanuda si el sistema lo suspendió
}

// Redraw on theme change
window.addEventListener('mt-theme-change', () => {
    themeColors = null;
    lastRadialKey = '';
    renderDisplay(currentSequence.length ? currentSequence : ['C4','E4','G4','E4','C4'], currentStepIdx);
});

window.onload = init;
</script>
